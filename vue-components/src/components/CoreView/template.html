<div style="position: relative; width: 100%; height: 100%; overflow: hidden;">
  <div :style="frameStyle">
    <div v-for="i in coreWidth" :key="'x' + i" :style="xLabelStyle(i - 1)">
      {{ xLabels[i - 1] }}
    </div>
    <div v-for="j in coreHeight" :key="'y' + j" :style="yLabelStyle(j - 1)">
      {{ yLabels[j - 1] }}
    </div>
    <div
      :style="dataStyle"
      :class="{ busy, pointerCursor: !busy && overFilled }"
      @click="onClick"
      @mousemove="onHover"
      @mouseleave="exit"
    >
      <img v-if="core.url" :src="core.url" :style="imageStyle" />
      <div :style="gridStyle"></div>
      <div v-for="label in cellLabels" :key="label.key" :style="label.style">
        {{ label.text }}
      </div>
      <div :style="highlightStyle"></div>
    </div>
  </div>

  <div v-if="labelsHidden" :style="noteStyle">
    Values do not fit at this size
  </div>
</div>
