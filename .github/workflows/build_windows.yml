# .github/workflows/build_installables.yml
# Builds the PyInstaller app on Windows

name: build_windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64

    steps:
      - uses: actions/checkout@v4

      # ---------- Version ----------
      - name: Read version
        id: ver
        shell: bash
        run: |
          V=$(grep -E '^version = ' setup.cfg | head -1 | sed 's/version = //' | tr -d ' ')
          if [ -z "$V" ]; then echo "No version found in setup.cfg"; exit 1; fi
          echo "clean=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"  >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      # ---------- Vue components ----------
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vue-components/package-lock.json

      - name: Build Vue components
        shell: bash
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          cd vue-components
          npm ci
          npm run build

      # ---------- Python ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------- Install ----------
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      # ---------- Freeze ----------
      - name: Run PyInstaller
        shell: bash
        run: pyinstaller VeraCore.spec --noconfirm --clean

      # ========================= Windows installer =================================
      - name: Download WebView2 bootstrapper (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: curl -L -o MicrosoftEdgeWebview2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install innosetup -y --no-progress

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.ver.outputs.clean }} VeraCoreInno.iss

      # ========================= Release =================================
      - name: Upload installer to release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "Release ${{ steps.ver.outputs.clean }}" 2>/dev/null || true
          gh release upload "$TAG" "Output/VeraCoreSetup.exe" --repo "${{ github.repository }}" --clobber

      # ========================= Publish update manifest =================================
      - name: Publish version.json
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          V: ${{ steps.ver.outputs.clean }}
        run: |
          cat > version.json <<EOF
          {
            "version": "$V",
            "url": "https://github.com/${{ github.repository }}/releases",
            "mandatory": false,
            "min_supported": "1.0.0",
            "published": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": ""
          }
          EOF
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/jsalem5/vera-core-updates-test.git" pub
          cp version.json pub/version.json
          cd pub
          git config user.name  "ci"
          git config user.email "ci@users.noreply.github.com"
          git add version.json
          git commit -m "release $V" --allow-empty
          git push
