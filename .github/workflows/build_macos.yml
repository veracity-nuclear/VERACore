# .github/workflows/build_installables.yml
# Builds the PyInstaller app on macOS (arm64 & Intel).

name: build_macos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-intel

    env:
      RELEASE_TAG: build-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # ---------- Vue components ----------
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vue-components/package-lock.json

      - name: Build Vue components
        shell: bash
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          cd vue-components
          npm ci
          npm run build

      # ---------- Python ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------- Install ----------
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      # ---------- Freeze ----------
      - name: Run PyInstaller
        shell: bash
        run: pyinstaller VeraCore.spec --noconfirm --clean

      # ========================= Package + upload =================================
      - name: Package app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: tar -czf "VeraCore-${{ matrix.name }}.tar.gz" -C dist VeraCore

      - name: Upload tarball to release (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --title "$RELEASE_TAG" --notes "Automated build" 2>/dev/null || true
          gh release upload "$RELEASE_TAG" "VeraCore-${{ matrix.name }}.tar.gz" --repo "${{ github.repository }}" --clobber