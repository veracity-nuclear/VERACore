# .github/workflows/build_installables.yml
# Builds the PyInstaller app on Windows

name: build_windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64

    env:
      RELEASE_TAG: build-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # ---------- Vue components ----------
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vue-components/package-lock.json

      - name: Build Vue components
        shell: bash
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          cd vue-components
          npm ci
          npm run build

      # ---------- Python ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------- Install ----------
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      # ---------- Freeze ----------
      - name: Run PyInstaller
        shell: bash
        run: pyinstaller VeraCore.spec --noconfirm --clean

      # ========================= Windows installer =================================
      - name: Download WebView2 bootstrapper (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: curl -L -o MicrosoftEdgeWebview2Setup.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install innosetup -y --no-progress

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" VeraCoreInno.iss'

      # ========================= Package + upload =================================

      - name: Upload installer to release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --title "$RELEASE_TAG" --notes "Automated build" 2>/dev/null || true
          gh release upload "$RELEASE_TAG" "Output/VeraCoreSetup.exe" --repo "${{ github.repository }}" --clobber
