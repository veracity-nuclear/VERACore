<div class="container" style="width: 100%; height: 100%; overflow: hidden;">
  <div :style="scaleStyle" style="position: relative; width: 100%; height: 100%;">
    <div
      :style="sizeStyle"
      style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);"
      :key="imagesReady"
    >
      <v-col class="content ma-0 pa-0">
        <v-row class="ma-0 pa-0 flex-nowrap">
          <v-sheet height="30" width="30" class="ma-0 pa-0" />
          <v-sheet
            v-for="i in coreWidth"
            :key="i"
            height="30"
            width="30"
            class="d-flex flex-column justify-center ma-0 pa-0"
            rounded
            :dark="i==activeI+1"
          >
            <div class="text-center text-overline">
              {{ xLabels[i-1] }}
            </div>
          </v-sheet>
        </v-row>
        <v-row v-for="(line, j) in value" :key="j" class="ma-0 pa-0 flex-nowrap">
          <v-sheet
            height="30"
            width="30"
            class="d-flex flex-column justify-center ma-0 pa-0"
            rounded
            :dark="j==activeJ"
          >
            <div class="text-center text-overline">
              {{ yLabels[j] }}
            </div>
          </v-sheet>
          <v-sheet
            v-for="(assembly, i) in line"
            :key="i"
            height="30"
            width="30"
            outlined
            class="ma-0 pa-0"
            :style="toStyle(i, j)"
            :class="{ busy, pointerCursor: !busy && isFilled(i, j) }"
            @click="isFilled(i, j) && $emit('click', { i, j })"
            @mouseenter="isFilled(i, j) && hover(i, j)"
            @mouseleave="exit"
          >
            <div style="position: relative; width: 100%; height: 100%;">
              <img :src="toUrl(i, j)" style="width: 100%; height: 100%" />

              <!-- Node values, one per image cell -->
              <svg
                v-if="showValues && isFilled(i, j)"
                :viewBox="labelViewBox"
                fill="black"
                stroke="rgba(255,255,255,0.75)"
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                       font-family: Roboto, sans-serif; paint-order: stroke;"
              >
                <text
                  v-for="(label, li) in labels[j][i]"
                  :key="li"
                  :x="label.x"
                  :y="label.y"
                  :font-size="label.size"
                  :stroke-width="label.size * 0.18"
                  text-anchor="middle"
                  dominant-baseline="central"
                >
                  {{ label.text }}
                </text>
              </svg>
            </div>
          </v-sheet>
        </v-row>
      </v-col>
    </div>
  </div>
</div>
