<div class="container" style="width: 100%; height: 100%; overflow: hidden;">
  <div :style="scaleStyle" style="position: relative; width: 100%; height: 100%;">
    <div :style="sizeStyle" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
      <v-col class="content ma-0">
        <v-row class="ma-0">
          <v-sheet height="30" width="30" />
          <v-sheet
            v-for="i in coreWidth"
            :key="i"
            height="30" width="30"
            class="d-flex flex-column justify-center"
            rounded
            :dark="i == activeI + 1"
          >
            <div class="text-center text-overline">{{ xLabels[i - 1] }}</div>
          </v-sheet>
        </v-row>
        <v-row
          v-for="(line, j) in value"
          :key="j"
          class="ma-0"
        >
          <v-sheet
            height="30" width="30"
            class="d-flex flex-column justify-center"
            rounded
            :dark="j == activeJ"
          >
            <div class="text-center text-overline">{{ yLabels[j] }}</div>
          </v-sheet>

          <v-sheet
            v-for="(cell, i) in line"
            :key="i"
            height="30" width="30"
            outlined
            :style="toStyle(i, j)"
            :class="{ busy, pointerCursor: !busy }"
            @click="hasCell(i, j) && $emit('click', { i, j })"
            @mouseenter="hover(i, j)"
            @mouseleave="exit"
          >
            <div style="position: relative; width: 100%; height: 100%;">
              <svg
                v-if="hasCell(i, j)"
                :viewBox="`0 0 ${cellSize} ${cellSize}`"
                preserveAspectRatio="none"
                style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;"
              >
                <line
                  v-for="(g, gi) in gridLines"
                  :key="gi"
                  :x1="g.x1" :y1="g.y1" :x2="g.x2" :y2="g.y2"
                  stroke="#ddd"
                  stroke-width="1"
                  vector-effect="non-scaling-stroke"
                />
                <polyline
                  :points="toPoints(i, j)"
                  fill="none"
                  stroke="black"
                  stroke-width="1"
                  vector-effect="non-scaling-stroke"
                />
              </svg>
              <div v-if="toLabel(i, j)" class="assembly-label">
                {{ toLabel(i, j) }}
              </div>
            </div>
          </v-sheet>
        </v-row>
      </v-col>
    </div>
  </div>
</div>
