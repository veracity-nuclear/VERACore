<div class="vera-core-axial" style="width: 100%; height: 100%; overflow: hidden;">
  <svg
    :viewBox="viewBox"
    preserveAspectRatio="xMidYMid meet"
    style="width: 100%; height: 100%; display: block;"
    @mouseleave="exit"
  >
    <g class="axis-labels" :fill="theme.label">
      <text
        v-for="(cell, i) in (cells[0] || [])"
        :key="'col-' + i"
        :x="columnX(i)"
        :y="gutter * 0.62"
        :font-size="labelFont"
        :font-weight="i === activeI ? 700 : 400"
        text-anchor="middle"
        dominant-baseline="middle"
      >
        {{ xLabels[i] }}
      </text>
      <text
        v-for="(row, j) in cells"
        :key="'row-' + j"
        :x="gutter * 0.5"
        :y="rowY(j)"
        :font-size="labelFont"
        :font-weight="j === activeJ ? 700 : 400"
        text-anchor="middle"
        dominant-baseline="middle"
      >
        {{ yLabels[j] }}
      </text>
    </g>
    <template v-for="row in cells">
      <g
        v-for="cell in row"
        :key="cell.j + '-' + cell.i"
        :transform="`translate(${cell.tx}, ${cell.ty})`"
      >
        <template v-if="cell.shape">
          <rect
            :x="box.x"
            :y="box.y"
            :width="box.width"
            :height="box.height"
            :fill="isHovered(cell) ? theme.surfaceHover : theme.surface"
            :stroke="cell.border"
            :stroke-width="borderWidth"
            vector-effect="non-scaling-stroke"
          />
          <line
            v-for="(g, gi) in gridLines"
            :key="'g' + gi"
            :x1="g.x1"
            :y1="g.y1"
            :x2="g.x2"
            :y2="g.y2"
            :stroke="theme.grid"
            stroke-width="1"
            vector-effect="non-scaling-stroke"
          />
          <line
            v-if="referenceLine"
            :x1="referenceLine.x1"
            :y1="referenceLine.y1"
            :x2="referenceLine.x2"
            :y2="referenceLine.y2"
            :stroke="theme.reference"
            stroke-width="1"
            stroke-dasharray="2 2"
            vector-effect="non-scaling-stroke"
          />

          <path
            v-if="cell.shape.kind === 'path'"
            :d="cell.shape.d"
            fill="none"
            :stroke="cell.shape.color"
            :stroke-width="seriesWidth"
            stroke-linejoin="round"
            vector-effect="non-scaling-stroke"
          />
          <path
            v-if="cell.shape.kind === 'points'"
            :d="cell.shape.d"
            fill="none"
            :stroke="cell.shape.color"
            :stroke-width="pointDiameter"
            stroke-linecap="round"
            vector-effect="non-scaling-stroke"
          />

          <text
            v-if="cell.label"
            class="assembly-label"
            :x="cellW * 0.5"
            :y="box.y + box.height - 3"
            :font-size="labelFont * 0.8"
            :fill="theme.label"
            text-anchor="middle"
          >
            {{ cell.label }}
          </text>
        </template>
        <rect
          :width="cellW"
          :height="cellH"
          fill="transparent"
          :style="{ cursor: busy ? 'wait' : (cell.shape ? 'pointer' : 'default') }"
          @click="select(cell)"
          @mouseenter="hover(cell)"
        />
      </g>
    </template>
    <g
      v-if="selectionPath"
      pointer-events="none"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        :d="selectionPath"
        :stroke="theme.halo"
        :stroke-width="haloWidth"
        vector-effect="non-scaling-stroke"
      />
      <path
        :d="selectionPath"
        :stroke="selectionStroke"
        :stroke-width="bracketWidth"
        vector-effect="non-scaling-stroke"
      />
    </g>
  </svg>
</div>
