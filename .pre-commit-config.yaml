exclude: |
  (?x)^(
      vue-components/node_modules/|
      vue-components/dist/|
      build/|
      dist/|
      venv/|
      \.venv/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: package-lock\.json$
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        args: ["-q", "tests/"]

      - id: eslint
        name: ESLint
        entry: npm --prefix vue-components run lint:fix
        language: system
        files: ^vue-components/.*\.(js|vue)$
        pass_filenames: false

      - id: prettier
        name: Prettier
        entry: npm --prefix vue-components run format
        language: system
        files: ^vue-components/src/.*\.(js|vue|html|css)$
        pass_filenames: false


default_install_hook_types: [pre-commit, pre-push]
