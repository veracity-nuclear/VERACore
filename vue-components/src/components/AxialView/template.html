<div class="container" style="width: 100%; height: 100%; overflow: hidden;">
  <div :style="scaleStyle" style="position: relative; width: 100%; height: 100%;">
    <div :style="sizeStyle" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
      <div style="position: relative;" @mouseleave="exit">

        <!-- Column header row -->
        <div style="display: flex;">
          <div style="width: 30px; height: 30px; flex: none;"></div>
          <div
            v-for="(cell, i) in (value[0] || [])"
            :key="i"
            :style="{ width: xSizes[i] * xScale + 'px' }"
            style="height: 30px; flex: none; display: flex; align-items: center; justify-content: center;"
            class="text-overline"
          >
            {{ xLabels[i] }}
          </div>
        </div>

        <!-- One <img> per row. mousemove updates the hovered column from
             the cursor x position; click emits the same { i, j } as before. -->
        <div
          v-for="(line, j) in value"
          :key="j"
          style="display: flex;"
        >
          <div
            :style="{ height: ySizes[j] * yScale + 'px' }"
            style="width: 30px; flex: none; display: flex; align-items: center; justify-content: center;"
            class="text-overline"
          >
            {{ yLabels[j] }}
          </div>
          <div
            :style="{ width: rowWidthPx + 'px', height: ySizes[j] * yScale + 'px' }"
            style="flex: none; position: relative;"
            :class="{ busy, pointerCursor: !busy }"
            @click="onRowClick($event, j)"
            @mousemove="onRowHover($event, j)"
          >
            <img :src="rowUrl(j)" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block;" />
          </div>
        </div>

        <!-- Single highlight overlay -->
        <div :style="highlightStyle"></div>

      </div>
    </div>
  </div>
</div>
